<!DOCTYPE html>
<html lang="en">
<head>


    <meta charset="UFT-8" />
    <meta name="viewpoint" content="width=device-width,inital-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">

    
</head>
<body>
    <div class="cont">
        <div class="cal">
            <div class="out">
                 <div id="his">
                    <p id="o_value"></p>
                  </div>
                <div>
                <div class="res">
                        <p id="res"></p>
                  </div>
                </div>
            </div>
            <div class="keyboard">
                <button class="op" id="all-clear">C</button>
                <button class="op" id="clear">CE</button>
                <button class="op" id="/">/</button>
                <button class="op" id="%">%</button>
                <button class="num" id="7">7</button>
                <button class="num" id="8">8</button>
                <button class="num" id="9">9</button>
                <button class="op" id="*">x</button>
                <button class="num" id="4">4</button>
                <button class="num" id="5">5</button>
                <button class="num" id="6">6</button>
                <button class="op" id="-">-</button>
                <button class="num" id="1">1</button>
                <button class="num" id="2">2</button>
                <button class="num" id="3">3</button>
                <button class="op" id="+">+</button>
                <button class="op" id="0">0</button>
                <button class="emp" id="emp"></button>
                <button class="emp" id="emp"></button>
                <button class="op" id="=">=</button>

              
                

                
            </div>

        </div>

    </div>
    <script src="script.js"></script>






</body>
</html>
