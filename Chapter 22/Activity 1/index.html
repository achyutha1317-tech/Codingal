<!DOCTYPE html>
<html lang="en">


    <meta charset="UFT-8">
    <meta name="viewpoint" content="width=device-width,inital-scale=1.0">
    <title>My Phone Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    


</head>

<body class="py-4">
    <div class="container">
        <h1 class="mb-1">My phone Contact Page</h1>
        <p class="text">Learning Objects in JS using HTML and Bootstrap with plain CSS to......</p>

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h5 class="card-title"> Contact Details</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                     <span class="card-label d-block">Name</span>
                     <strong id="name">-</strong>
                    </li>
                    <li class="list-group-item"><span class="card-label d-block">Address</span>
                    <strong id="add"></strong></li>
                    <li class="list-group-item"><span class="card-label d-block">Mobile</span>
                    <strong id="mob"></strong></li>
                    <li class="list-group-item"><span class="card-label d-block">Soical Link</span>
                    <strong id="soical"></strong></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="card-shadow-sm">
        <div class="card-body">
            <h6>Javascript Object Used:</h6>
            <pre id="code" class="bg-light p-3 rounded border mb-0"></pre>

        </div>

    </div>

    <script>

let contact = {
  name: "Raghav",
  address: "Banglore, Karnataka, India",
  mobile: "8397004899",
  social: "Instagram"
}

let nameEl = document.getElementById("name")
let addressEl = document.getElementById("add")
nameEl.textContent = contact.name;
addressEl.textContent = contact.address;




let mobileEl = document.getElementById("mob")
let socialEl = document.getElementById("social")
mobileEl.textContent = contact.mobile;
socialEl.textContent = contact.social;

let codeEl = document.getElementById("codeDisplay");
    codeEl.textContent =
      'let myContact = {\n' +
      '  name:   "' + myContact.name + '",\n' +
      '  mobile:  "' + myContact.phone + '",\n' +
      '  social: "' + myContact["social"] + '",\n' +
      '  address:   "' + myContact["address"] + '"\n' +
      '};';

    </script>



</body>
</html>
