<body>
    <h1>Learning JavaScript's String Method</h1>
<p>Learning only few of them...Visit from the website to learn more.......</p>
<script>
    let str = "AchyuTHaRaghavan";
 document.write(str.toLowerCase());
 document.write("<br />");
 document.write(str.toUpperCase());
 document.write("<br />");
 document.write(str.startsWith("A"));
 document.write("<br />");
 

 //Regular Expressions convert the value given to  it in a format thats better in doing certain  programing computatin
 let reg = new RegExp("hind")
 document.write(reg);
 document.write("<br />");

 let ans = reg.test(str)
 document.write(ans)

</script>
