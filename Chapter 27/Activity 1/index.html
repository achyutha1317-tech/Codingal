<!DOCTYPE html>
<html lang="en">
<head>


    <meta charset="UFT-8" />
    <meta name="viewpoint" content="width=device-width,inital-scale=1.0" />
    <title>Social Media Footer</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link
     href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap"
     rel="stylesheet" />
     <link rel="stylesheet" href="style.css">
   
    
</head>
<body>
    <div id="social" class="container-fluid">
        <div class="container text-wite py-5">
            <h3 class="text-warning">Social Media</h3>
            <h1 class="head">Lets go online...</h1>
            <div class="row pt-4">
                <div class="col-3 media-link-btn">
                    <div class="row">
                        <div class="col-6 d-flex   justify-content-start">
                            <h3 class="m-0 pt-2 text-white">LinkedIN</h3>
                        </div>
                        
                        <div class="col-6 d-flex justify-content-end align-item-center">
                            <i class="fab fa-linkedin-in fa-2x text-secondary"></i>
                        </div>

                    </div>

                </div>

                <div class="col-3 media-link-btn">
                    <div class="row">
                        <div class="col-6 d-flex   justify-content-start">
                            <h3 class="m-0 pt-2 text-white">Facebook</h3>
                        </div>
                        
                        <div class="col-6 d-flex justify-content-end align-item-center">
                            <i class="fab fa-facebook fa-2x text-secondary"></i>
                        </div>
                    </div>
                </div>
                
                <div class="col-3 media-link-btn">
                    <div class="row">
                        <div class="col-6 d-flex   justify-content-start">
                            <h3 class="m-0 pt-2 text-white">Youtube</h3>
                        </div>
                        
                        <div class="col-6 d-flex justify-content-end align-item-center">
                            <i class="fab fa-youtube fa-2x text-secondary"></i>
                        </div>
                    </div>
                </div>

                <div class="col-3 media-link-btn bg-warning">
                    <div class="row">
                        <div class="col-6 d-flex   justify-content-start">
                            <h3 class="m-0 pt-2 text-dark">Mail</h3>
                        </div>
                        
                        <div class="col-6 d-flex justify-content-end align-item-center">
                            <i class="fas fa-envelope fa-2x text-secondary"></i>
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </div>


 
</body>
</html>
